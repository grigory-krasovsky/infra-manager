# Сборка и тесты на каждый push и pull request.
#
# Секретов здесь нет и быть не должно. Тесты поднимают собственный Postgres через
# Testcontainers, а Trello, Telegram, Bitbucket, Bamboo и Jira подменяются — так что
# токены Bitbucket, Bamboo и Jira остаются в .env на той машине, где сервис работает,
# и в GitHub не попадают. Это ограничение осознанное: корпоративные учётные данные
# наружу не выносим.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  # Новый push в ту же ветку отменяет предыдущий прогон: смысл есть только в
  # последнем состоянии ветки.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      # Интеграционные тесты стартуют postgres:17-alpine через Testcontainers;
      # на ubuntu-latest демон Docker уже запущен, ставить нечего.
      - name: Build and test
        run: ./mvnw -B verify

  image:
    # Только с master: собрать образ — это ещё раз прогнать Maven внутри Docker,
    # и на каждую ветку это лишние минуты. Проверяем то, что реально поедет.
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Собирается, но никуда не публикуется: успешный jar ничего не говорит о
      # том, соберётся ли контейнер, а деплой пока делается руками на машине
      # внутри периметра.
      - name: Build the image
        run: docker build -t infra-manager:${{ github.sha }} .
